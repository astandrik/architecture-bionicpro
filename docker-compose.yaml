x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: bionicpro-airflow-secret
    TELEMETRY_DSN: postgresql://telemetry_user:telemetry_password@telemetry_db:5432/telemetry_db
    CLICKHOUSE_URL: http://clickhouse:8123
    CLICKHOUSE_DATABASE: bionicpro
    CLICKHOUSE_USER: default
    CLICKHOUSE_PASSWORD: clickhouse_password
    S3_ENDPOINT: http://minio:9000
    S3_BUCKET: bionicpro-reports
    S3_ACCESS_KEY_ID: minioadmin
    S3_SECRET_ACCESS_KEY: minioadmin123
    S3_REGION: us-east-1
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
  depends_on:
    airflow_db:
      condition: service_healthy
    telemetry_db:
      condition: service_healthy
    clickhouse:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  auth_db:
    image: postgres:14
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
      - ./bionicpro-auth/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5434:5432"

  crm_db:
    image: postgres:14
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=4
      - -c
      - max_replication_slots=4
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    volumes:
      - crm-postgres-data:/var/lib/postgresql/data
      - ./crm/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  telemetry_db:
    image: postgres:14
    environment:
      POSTGRES_DB: telemetry_db
      POSTGRES_USER: telemetry_user
      POSTGRES_PASSWORD: telemetry_password
    volumes:
      - telemetry-postgres-data:/var/lib/postgresql/data
      - ./telemetry/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry_user -d telemetry_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: quay.io/debezium/kafka:3.4
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      NODE_ID: 1
      NODE_ROLE: combined
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

  kafka-connect:
    image: quay.io/debezium/connect:3.4
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: bionicpro_connect_configs
      OFFSET_STORAGE_TOPIC: bionicpro_connect_offsets
      STATUS_STORAGE_TOPIC: bionicpro_connect_statuses
      REST_HOST_NAME: 0.0.0.0
      CONNECT_PLUGIN_PATH: /tmp/connect-plugins
    entrypoint: /bin/bash
    command:
      - -c
      - |
        rm -rf /tmp/connect-plugins
        mkdir -p /tmp/connect-plugins
        ln -s /kafka/connect/debezium-connector-postgres /tmp/connect-plugins/debezium-connector-postgres
        exec /docker-entrypoint.sh start
    depends_on:
      - kafka

  debezium-init:
    image: curlimages/curl:8.9.1
    depends_on:
      kafka-connect:
        condition: service_started
      crm_db:
        condition: service_healthy
    volumes:
      - ./debezium:/debezium:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until curl -fsS http://kafka-connect:8083/connectors >/dev/null; do
          sleep 2
        done
        curl -fsS -X PUT \
          -H 'Accept: application/json' \
          -H 'Content-Type: application/json' \
          --data @/debezium/bionicpro-crm-postgres.json \
          http://kafka-connect:8083/connectors/bionicpro-crm-postgres/config

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse_password
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user default --password clickhouse_password --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    ports:
      - "9003:9001"

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin123; do
          sleep 2
        done
        mc mb --ignore-existing local/bionicpro-reports
        mc anonymous set download local/bionicpro-reports

  reports-cdn:
    image: nginx:1.31.0-alpine
    ports:
      - "8082:80"
    environment:
      REPORTS_CDN_SIGNING_SECRET: ${REPORTS_CDN_SIGNING_SECRET:-bionicpro-reports-cdn-signing-secret}
    volumes:
      - ./nginx/reports-cdn.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully

  airflow_db:
    image: postgres:14
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname BionicPRO \
          --lastname Admin \
          --role Admin \
          --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  reports-api:
    build:
      context: ./reports-api
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: bionicpro
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse_password
      REPORTS_PIPELINE_NAME: bionicpro_reports_daily
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: bionicpro-reports
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin123
      S3_FORCE_PATH_STYLE: "true"
      REPORTS_CDN_BASE_URL: http://localhost:8082/reports
      REPORTS_OBJECT_KEY_SECRET: bionicpro-reports-object-key-secret
      REPORTS_CDN_SIGNING_SECRET: ${REPORTS_CDN_SIGNING_SECRET:-bionicpro-reports-cdn-signing-secret}
      REPORTS_CDN_URL_TTL_SECONDS: 900
      AWS_SDK_JS_NODE_VERSION_SUPPORT_WARNING_DISABLED: "true"
    depends_on:
      keycloak:
        condition: service_started
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  reports-versioner:
    build:
      context: ./reports-api
      dockerfile: Dockerfile
    command: node src/versioner.js
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: bionicpro
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse_password
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs
      REPORTS_PIPELINE_NAME: bionicpro_reports_daily
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: bionicpro-reports
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin123
      S3_FORCE_PATH_STYLE: "true"
      REPORTS_CDN_BASE_URL: http://localhost:8082/reports
      REPORTS_OBJECT_KEY_SECRET: bionicpro-reports-object-key-secret
      REPORTS_CDN_SIGNING_SECRET: ${REPORTS_CDN_SIGNING_SECRET:-bionicpro-reports-cdn-signing-secret}
      REPORTS_CDN_URL_TTL_SECONDS: 900
      REPORTS_VERSIONER_INTERVAL_SECONDS: 5
      AWS_SDK_JS_NODE_VERSION_SUPPORT_WARNING_DISABLED: "true"
    depends_on:
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: BionicPRO
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin
    command: --copy-service
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bionicpro.ldif:ro
    ports:
      - "3890:389"

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
      - openldap

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      AUTH_BASE_URL: http://localhost:8000
      FRONTEND_ORIGIN: http://localhost:3001
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: bionicpro-auth
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change-me-auth-client-secret}
      AUTH_COOKIE_SECRET: change-me-cookie-secret
      AUTH_TOKEN_ENCRYPTION_KEY: change-me-token-encryption-key
      AUTH_COOKIE_SECURE: "false"
      AUTH_SESSION_TTL_SECONDS: 1800
      DATABASE_URL: postgres://auth_user:auth_password@auth_db:5432/auth_db
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URL: http://localhost:8000/yandex/callback
      YANDEX_BROKER_ISSUER: http://localhost:8000/yandex
      YANDEX_BROKER_CLIENT_ID: bionicpro-yandex-broker
      YANDEX_BROKER_CLIENT_SECRET: ${YANDEX_BROKER_CLIENT_SECRET:-change-me-yandex-oidc-client-secret}
      UPSTREAM_API_URL: http://reports-api:8001
    depends_on:
      - keycloak
      - auth_db
      - reports-api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      REACT_APP_AUTH_URL: http://localhost:8000
    depends_on:
      - bionicpro-auth

volumes:
  auth-postgres-data:
  crm-postgres-data:
  telemetry-postgres-data:
  clickhouse-data:
  minio-data:
  airflow-postgres-data:
